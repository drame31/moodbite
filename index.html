<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Food, drink, playlist, and ambiance matched to your mood — with a reason why each one fits. Six moods, tag filters, localStorage favorites. A front-end portfolio project by Derek Muñoz." />
    <meta name="theme-color" content="#0C0B0A" />
    <link rel="canonical" href="https://drame31.github.io/moodbite/" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="MoodBite — Pick a vibe. Get the bite." />
    <meta property="og:description" content="Food, drink, playlist, and ambiance matched to your mood — with a reason why each one fits. Six moods, tag filters, localStorage favorites. A front-end portfolio project by Derek Muñoz." />
    <meta property="og:image"       content="https://drame31.github.io/moodbite/og-image.png" />
    <meta property="og:url"         content="https://drame31.github.io/moodbite/" />
    <meta property="og:site_name"   content="MoodBite" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="MoodBite — Pick a vibe. Get the bite." />
    <meta name="twitter:description" content="Food, drink, playlist, and ambiance matched to your mood — with a reason why each one fits. Six moods, tag filters, localStorage favorites. A front-end portfolio project by Derek Muñoz." />
    <meta name="twitter:image"       content="https://drame31.github.io/moodbite/og-image.png" />

    <!-- Theme flash prevention — runs before React, before any CSS -->
    <script>
      try {
        var t = localStorage.getItem('moodbite_theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch (_) {}
    </script>

    <!-- Preconnect for font performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Single request for all three families -->
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    >

    <title>MoodBite — Pick a vibe. Get the bite. | Derek Muñoz</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
